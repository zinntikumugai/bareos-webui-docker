; --- php2shell hardening (Bareos WebUI) ---
; php-fpm 8.3 の conf.d drop-in として読み込まれ、既定の php.ini を上書きする。
; Bareos WebUI は Director と TCP ソケットで通信するだけで、コマンド実行系関数・
; ファイルアップロード・URL インクルードを必要としないため、以下の無効化は
; アプリ動作に影響しない。

; Web シェルの要であるコマンド実行/プロセス制御系を無効化
; - mail / mb_send_mail / putenv: putenv("LD_PRELOAD=...") + mail() (内部で /bin/sh を起動)
;   による disable_functions 回避手口を封じる
; - posix_* / pcntl_*: プロセス・権限操作系 (WebUI は未使用)
; - error_log は WebUI が多用するため無効化しない (putenv 無効化で LD_PRELOAD 経路は塞がる)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,proc_close,proc_get_status,proc_nice,proc_terminate,dl,mail,mb_send_mail,putenv,pcntl_alarm,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_signal_dispatch,pcntl_sigprocmask,pcntl_sigtimedwait,pcntl_sigwaitinfo,pcntl_wait,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig,posix_kill,posix_mkfifo,posix_mknod,posix_setegid,posix_seteuid,posix_setgid,posix_setpgid,posix_setsid,posix_setuid

; PHP がアクセスできるファイルパスをアプリ関連に限定
; /usr/share/php は PHP の include_path (.:/usr/share/php) に含まれるため許可する
; (ログイン後のモジュールがシステム PHP ライブラリを読み込む場合がある)
open_basedir = /usr/share/bareos-webui/:/usr/share/php/:/etc/bareos-webui/:/var/lib/bareos-webui/:/var/log/bareos/:/tmp/:/var/lib/php/sessions/:/dev/urandom

; リモートファイルインクルード(RFI)対策
allow_url_fopen = Off
allow_url_include = Off

; 不要機能の停止・情報漏えい低減
file_uploads = Off
enable_dl = Off
expose_php = Off

; セッション Cookie 保護 (WebUI 側でも httponly/samesite/secure を設定しているが、
; php.ini 層でも多層防御として既定値を固める)
; cookie_secure は WebUI が HTTPS 判定して動的に設定するためここでは指定しない
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
