; --- php2shell hardening (Bareos WebUI) ---
; php-fpm 8.3 の conf.d drop-in として読み込まれ、既定の php.ini を上書きする。
; Bareos WebUI は Director と TCP ソケットで通信するだけで、コマンド実行系関数・
; ファイルアップロード・URL インクルードを必要としないため、以下の無効化は
; アプリ動作に影響しない。

; Web シェルの要であるコマンド実行/プロセス制御系を無効化
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,proc_close,proc_get_status,proc_nice,proc_terminate,pcntl_exec,pcntl_fork,pcntl_wait,pcntl_waitpid,dl

; PHP がアクセスできるファイルパスをアプリ関連に限定
; /usr/share/php は PHP の include_path (.:/usr/share/php) に含まれるため許可する
; (ログイン後のモジュールがシステム PHP ライブラリを読み込む場合がある)
open_basedir = /usr/share/bareos-webui/:/usr/share/php/:/etc/bareos-webui/:/var/lib/bareos-webui/:/var/log/bareos/:/tmp/:/var/lib/php/sessions/:/dev/urandom

; リモートファイルインクルード(RFI)対策
allow_url_fopen = Off
allow_url_include = Off

; 不要機能の停止・情報漏えい低減
file_uploads = Off
enable_dl = Off
expose_php = Off
